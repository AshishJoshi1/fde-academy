# Flash cards: what building FDE Academy taught. Schema: Deck in src/academy_server/content/schema.py.
# Every fact comes from a record (the card's source), never from memory. /wrap proposes new cards
# from each session; only the ones Ashish approves are added here.
id: build
title: "Building FDE Academy"
summary: |
  What building this lab taught: how the work is organised, where the cost goes, and why the app is
  built the way it is. A card you didn't know comes back in spaced review and in `/today`.
tags:
  workflow: Workflow
  cost: Cost
  security: Security
  gateway: Gateway
  engineering: Engineering

cards:
  # ----------------------------------------------------------------- workflow
  - id: one-lesson-per-session
    tag: workflow
    front: |
      Why does each lesson get its own Claude Code session?
    back: |
      Claude Code is a client of the same **stateless** API you study in s01: every turn resends the
      whole conversation so far. A long session pays for all of its earlier text again on every
      message (mostly as cache reads, but still), so each turn costs more than the last.

      A fresh session per lesson keeps every turn small. `/wrap` and PROGRESS.md carry what matters
      into the next one.
    source: "CLAUDE.md, How we work (one lesson per session)"

  - id: outline-first
    tag: workflow
    front: |
      Why is a lesson's outline approved before any content or feature is built?
    back: |
      Rework is the expensive part. Agreeing on the guide-step titles (one line each, plus any
      experiment) takes minutes; building the wrong lesson costs a session.

      It also keeps the rule "no feature without a lesson that needs it": a feature only appears
      in an outline when a step uses it.
    source: "docs/PLAN.md, How a lesson is made (step 0)"

  - id: state-lives-in-files
    tag: workflow
    front: |
      A new Claude Code session remembers nothing of the last one. What carries the state across?
    back: |
      Files, not the conversation:

      - PROGRESS.md: the exact stopping point and the next first action;
      - the learner database export, `progress/learner-progress.json`;
      - git.

      `/wrap` writes them at the end of a session; `/today` and the SessionStart hook read them at
      the start. It's the s01 lesson again: the model keeps no state, so your code (here, your
      files) keeps the history.
    source: ".claude/commands/wrap.md, .claude/commands/today.md"

  # --------------------------------------------------------------------- cost
  - id: cache-share
    tag: cost
    front: |
      In the second session of 2026-11-09, where did 97% of Claude Code's input tokens come from?
    back: |
      From the **prompt cache**. Every turn resends the whole conversation, but the unchanged prefix
      is read from the cache at a fraction of the input price: on Opus 5.5 a cache read costs $0.20
      per million tokens against $4 for plain input (0.05×).

      Caching is what makes a long, stateless conversation affordable.
    source: "PROGRESS.md, Cost log; pricing.yaml"

  - id: big-skill
    tag: cost
    front: |
      What share of one session's usage did loading the `/claude-api` skill take, and why so much?
    back: |
      About **32%**. A skill's text is added to the conversation, and from then on every turn
      resends it with everything else.

      Load a large reference only when the work needs it.
    source: "PROGRESS.md, Cost log (2026-11-09, second session)"

  - id: idle-gap
    tag: cost
    front: |
      What happens to the cost when a Claude Code session sits idle for over an hour?
    back: |
      The prompt cache expires. The next turn misses, and the whole conversation is written to the
      cache again: one such miss re-cached **26.9K tokens**.

      A cache write costs more than plain input (1.25× for the 5-minute TTL, 2× for the 1-hour TTL),
      while a read costs far less. A long pause is a good moment to `/wrap` and start fresh.
    source: "PROGRESS.md, Cost log; pricing.yaml"

  - id: tutor-prefix
    tag: cost
    front: |
      The tutor's first question on a step cost about $0.028, and a follow-up about $0.005. What made
      the difference?
    back: |
      The **cached lesson prefix**. The rules and the authored lesson (about 10.4K tokens) come first
      in every request. The first question writes them to the cache; a follow-up reads them at the
      cache-read price instead of full input.

      That's why the layers go most stable first (rules, lesson, then the thread): the cached prefix
      stays identical from call to call.
    source: "docs/PLAN.md, Architecture: Tutor (measured live on 2026-11-09)"

  - id: tutor-model
    tag: cost
    front: |
      Why does the tutor run on Sonnet 5.5 at effort `low`, while lesson code defaults to Opus 5.5?
    back: |
      A tutor answers many short questions, so price and speed matter more than depth. Sonnet 5.5
      costs half of Opus 5.5 ($2 and $10 against $4 and $20 per million input and output tokens). At
      effort `low` it returned no thinking blocks and answered in about 2.6–5 s.

      Lesson code defaults to Opus 5.5, the model the lessons measure.
    source: "docs/PLAN.md, Architecture: Tutor; pricing.yaml; PROGRESS.md (tutor measured live)"

  - id: tool-tokens
    tag: cost
    front: |
      In s02, the question alone is 33 tokens, but Call 1 sends 469 input tokens. Where do the other
      436 go?
    back: |
      To the **tool**. The API is stateless, so the `tools` list is sent again on every call, and
      one definition plus the instructions the API adds to explain tool use is about 436 tokens.

      Every tool you define is paid for on every call, used or not. Measured with `count_tokens`.
    source: "docs/PLAN.md, s02 \"The manual loop\": the end result (measured 2026-11-11)"

  - id: parallel-saves-calls
    tag: cost
    front: |
      What did `disable_parallel_tool_use` cost on a question that needs three independent lookups?
    back: |
      **4 calls instead of 2**, and 3,689 input tokens instead of 1,933 (1.9×): $0.023 against $0.015.
      The results were the same size; every extra call resent the whole history.

      Leave parallel calls on, unless your tools must run one at a time.
    source: "docs/PLAN.md, \"s03 'Parallel tool calls': the end result\" (measured 2026-11-12)"

  - id: cache-miss-big-context
    tag: cost
    front: |
      Why can one prompt-cache miss late in a long session cost dollars?
    back: |
      A miss writes the whole conversation to the cache again, at the cache-write price ($8 per million
      tokens on Opus 5.5 with the 1-hour TTL). On 2026-11-12 one miss re-cached 260K tokens: about
      $2.08 of the session's $14.99.

      A fresh session per lesson keeps the context small, and so any miss.
    source: "PROGRESS.md, Cost log (2026-11-12)"

  - id: context-times-turns
    tag: cost
    front: |
      On 2026-11-12 the session cost $14.99, and the output (the actual work) only about $3. What was
      the other $12?
    back: |
      **Cache reads and cache writes**: about $6.16 and $5.77, nearly 80% of the bill. Each turn
      resends the whole conversation, so that cost grows with the context's size times the number of
      turns. The context had grown to about 235K tokens per request, over 131 requests.

      To cut the bill, shrink the context and make fewer turns; a cheaper reply barely moves it.
    source: "PROGRESS.md, Cost log (2026-11-12 and 2026-11-11 second session)"

  - id: fresh-session-per-task
    tag: cost
    front: |
      The glossary was built after the day's first `/wrap` and cost $2.97. Why so much for a small
      feature, and what's the rule?
    back: |
      Every one of its turns carried the whole day's context (about 235K tokens), so a small task paid
      for a big conversation. Built in a fresh session it would have cost about half (an estimate).

      After `/wrap`, run `/clear` before any new task, and give a request that arrives after a wrap
      its own session.
    source: "PROGRESS.md, Cost log (2026-11-12 and 2026-11-11 second session)"

  - id: read-in-parts
    tag: cost
    front: |
      Why read a big file in parts (grep, then `offset` and `limit`) instead of whole?
    back: |
      A file read stays in the conversation, so every later turn pays for it again. Reading
      `lab.html` whole (about 24K tokens) put it in every turn's context for the rest of the session.

      Search first, read only the lines you need, and don't re-read a file after editing it.
    source: "PROGRESS.md, Cost log (2026-11-11, second session)"

  # ----------------------------------------------------------------- security
  - id: dummy-key
    tag: security
    front: |
      Why does lesson code get a dummy API key and the relay's URL, not the real key?
    back: |
      The lesson process runs code you edit, so it's the least trusted part of the app. The relay
      (`/relay/{run_token}/v1/*`) holds the real key and forwards each call to the gateway, so the key
      never enters lesson code, its environment or its output.

      The same relay records every call's exact request, response, usage and timing for the lab.
    source: "docs/PLAN.md, Architecture: Thin relay; CLAUDE.md"

  - id: no-user-wide-env
    tag: security
    front: |
      Why are `ANTHROPIC_BASE_URL` and `ANTHROPIC_API_KEY` never set as user-wide environment variables?
    back: |
      **Claude Code reads the same names.** Set user-wide, they would switch Claude Code's own login
      to the lab's gateway key.

      They live only in `%LOCALAPPDATA%\fde-academy\anthropic.env`. `run_live.py` hands them to the
      lesson process, and the server uses them for the relay and the tutor.
    source: "CLAUDE.md, Gateway (credentials)"

  # ------------------------------------------------------------------ gateway
  - id: trace-call-id
    tag: gateway
    front: |
      A gateway call misbehaves. Which response header do you quote to trace it, and why not `request-id`?
    back: |
      **`x-litellm-call-id`.** Calls go through the Bounteous LiteLLM proxy, which doesn't pass
      Anthropic's `request-id` header back (the SDK logs `request_id: None`).

      On an error, the gateway's envelope still carries Anthropic's `request_id`, inside its message
      string.
    source: "CLAUDE.md, Gateway (tracing, errors)"

  # -------------------------------------------------------------- engineering
  - id: live-only
    tag: engineering
    front: |
      Why do lessons make only live calls, with no recorded or replayed responses?
    back: |
      The point is to see what the model actually does: thinking that comes and goes, token counts
      that vary, real errors from the real gateway. A recording would teach one frozen answer.

      Live runs cost cents, the gateway enforces the key's $50 budget, and any past run can still be
      reopened for free from the store.
    source: "docs/PLAN.md, Principles (live calls only)"

  - id: utf8
    tag: engineering
    front: |
      Why is Python always run with `-X utf8` here?
    back: |
      Under Windows' default cp1252 encoding, the Meridian seed data ("Łódź") crashes Python.
      `-X utf8` makes UTF-8 the default for files and the console.
    source: "CLAUDE.md, Repo conventions"

  - id: stdlib-only
    tag: engineering
    front: |
      Why must `labctl.py`, `paths.py` and the store use only the standard library?
    back: |
      The SessionStart hook and `/today` run them with a **bare system Python**, outside the
      project's venv. One third-party import there and the session start breaks.

      The one part that needs packages, `labctl content validate`, says so and asks for the venv.
    source: "CLAUDE.md, Repo conventions"

  - id: no-tool-result
    tag: engineering
    front: |
      An agent loop sends a `tool_use` with no `tool_result` in the next message. What comes back, and
      does the SDK retry it?
    back: |
      **400 `invalid_request_error`**: "`tool_use` ids were found without `tool_result` blocks
      immediately after". A 4xx means the request itself is wrong, so the SDK doesn't retry: 2 calls
      in all, and the tool had already run.

      A tool that fails still gets a `tool_result`, with `is_error: true`.
    source: "content/m02-agent-loop/lab02-agent-loop/s02-manual-loop/step.yaml, experiment e2 (measured 2026-11-11)"

  - id: record-before-send
    tag: engineering
    front: |
      Why does the lab's mock API record each request as a run event *before* it sends the response?
    back: |
      To keep the run's events in the true order. Recorded after, the lesson could already have the
      response and made its next model call, so the timeline would show the API request after the
      call it fed.

      Record an event at the point where its outcome is decided, not after it is handed on.
    source: "src/academy_server/fixtures/__init__.py, module docstring"

  - id: split-tool-results
    tag: engineering
    front: |
      Does the API reject `tool_result`s sent in separate user messages, one result per message?
    back: |
      **No.** It joins consecutive user messages: measured, Call 2 sent the same 1,448 input tokens
      either way, with no error. But the docs warn that split results train Claude to stop making
      parallel calls, so send every result in one user message.

      The API won't flag it, so only a check in your code catches it (the lab's "one message" check).
    source: "docs/PLAN.md, \"s03 'Parallel tool calls': the end result\" (measured 2026-11-12)"

  - id: glossary-sync-test
    tag: engineering
    front: |
      How does the glossary stay in sync with the commands it lists?
    back: |
      A test walks `.claude/commands/*.md`, labctl's argparse subcommands and `tools/*.py`, and fails
      when any of them has no glossary entry.

      A reference page about things defined elsewhere drifts unless a test ties it to its sources.
    source: "tests/test_content.py, test_the_glossary_covers_every_slash_command_and_labctl_command; docs/PLAN.md, Learner tools"

  - id: prompt-rule-vs-gate
    tag: engineering
    front: |
      A system prompt says "never change CRM records" and the model obeyed in every measured run,
      even when the user claimed admin authority. Why add a gate in the loop anyway?
    back: |
      The rule is an instruction the model chooses to follow, and the loop runs whatever tool the
      model asks for. A check before the tool runs (`block.name in POLICY["blocked_tools"]`) makes
      "no write" independent of the model, the wording and the conversation.

      Runs that came out well don't prove the next one will.
    source: "docs/PLAN.md, \"s04 'Gate and block': the end result\" (measured 2026-11-12)"

  - id: gate-lists-names
    tag: engineering
    front: |
      Your policy blocks `get_opportunity` and a run still makes 0 writes. Is the write protected?
    back: |
      No. The gate guards exactly the tool names in `work/policy.json`. Here the model declined to
      write without reading the record: its caution, not the gate. `update_opportunity` wasn't
      listed, so the loop would have run it.

      A policy is a list you must get right: name the write tools.
    source: "docs/PLAN.md, \"s04 'Gate and block': the end result\" (measured 2026-11-12)"
