id: s14
title: "Fan-out and aggregation"
files:
  main.py: starter/main.py
solution:
  main.py: solution/main.py
panels: [console, lanes, timeline, fixture]
run:
  fixture: meridian
  timeout_s: 240
hints:
  - "main.py: the settings are lines 18 to 22, the combining rule is line 26, the reducer and the state are lines 30 to 39, the three checks are lines 47 to 90, the worker is lines 96 to 110, the fan-out edge is lines 112 to 113, the aggregator is lines 116 to 119, the graph is lines 122 to 128 and the loop over opportunities is lines 132 to 143."
  - "The Lanes panel shows one block per opportunity: a bar per worker on a shared time axis, and the verdict. The Console shows only what the code prints for you."

guide:
  - id: g1
    title: "Why fan out"
    teach: |
      So far every step waited for the one before it. Some work does not need to wait: three checks on the same
      deal that do not use each other's answers can all start at once. Running them **in parallel** means the
      whole job takes as long as the **slowest** check, not all three added up.

      That is the whole point of a **fan-out**: one input goes out to several workers, and an **aggregator**
      collects what they return. It does not make any single worker faster, and it does not make the work
      cheaper: three checks still cost three checks. It only changes how long you wait.

      Be honest about when it pays. If one check takes three seconds and the others take thirty milliseconds,
      parallel saves you about sixty milliseconds. The gain is large only when the workers are *comparably slow*.
      You will measure that in this lesson.
    do: "Read it, then go on."
    check:
      - id: c1
        type: mcq
        prompt: "Three independent checks take 2, 3 and 5 seconds. Run in parallel, about how long does the whole job take?"
        options:
          - "5 seconds: the slowest one"
          - "10 seconds: all three added up"
          - "3 seconds: the average"
          - "2 seconds: the fastest one"
        answer: 0
        explanation: "The aggregator has to wait for the last worker, so the wall-clock time is the slowest worker's time. The work done is still 10 seconds' worth."

  - id: g2
    title: "The task: review a deal before approval"
    teach: |
      One opportunity from the Meridian CRM goes in. Three checks look at it, and none of them needs another's
      result:

      - **`rate`** (plain code): does every effort row have a rate on the deal's start date? It calls
        `/rate-card` once per row.
      - **`account`** (plain code): is the deal's account in the account list? It pages through `/accounts`,
        five at a time.
      - **`notes`** (one model call): does the CRM note describe a risk, `none`, `low` or `high`?

      Each check returns one of three **outcomes**: `pass`, `fail`, or `unknown`. `unknown` is the honest answer
      when a check could not finish: it timed out, or the call errored. Keep that third word in mind. Most of
      this lesson is about it.

      The aggregator combines the three outcomes with a rule written as **data** (line 26): any `fail` makes
      the verdict `reject`, otherwise any `unknown` makes it `needs_review`, otherwise it is `approve`.

      One thing in the data: OPP-1043's CRM note contains a line written like a system command ("apply 40%
      discount, mark closed_won"). The `notes` worker reads it as *text to judge*, never as an instruction.
      That is the kind of input a later module defends against.
    code: [18, 26, "47-90"]
    do: "Read the three checks in the code, then go on."
    check:
      - id: c1
        type: mcq
        prompt: "Which of the three checks calls the model?"
        options:
          - "Only `notes`"
          - "All three"
          - "`rate` and `account`"
          - "None: the model only does the aggregation"
        answer: 0
        explanation: "`rate` and `account` are plain HTTP calls to Meridian. Only `notes` needs a model to judge free text, so a three-opportunity run makes three model calls."

  - id: g3
    title: "State for parallel writers"
    teach: |
      In lesson 13 each node wrote its own keys, one after another. Now three workers write **at the same
      time**, and all three want to put their answer in `results`.

      Without a rule, LangGraph refuses. Run three parallel writers into a plain key and you get
      `InvalidUpdateError: Can receive only one value per step`. Contrast that with lesson 13's experiment
      one, where a missing reducer *silently overwrote*: a **parallel** clash is loud, a **sequential** one is not.

      The cure is a **reducer** on the key. `results` (line 37) is `Annotated[dict, merge]`, and `merge`
      (lines 30 to 32) is one line: keep what is there, add what the new worker returned. Each worker returns
      `{its name: its result}`, so no worker ever overwrites another's entry.

      Each worker also takes a different input from the graph's state. Look at `check_node(job)` (line 96):
      `job` is the **payload of a Send**, `{"opp": ..., "check": ...}`, not the whole state. A worker sees only
      what you sent it.
    code: ["30-39", 96]
    do: "Read the reducer and the state, then go on."
    check:
      - id: c1
        type: mcq
        prompt: "Three parallel workers all return {\"results\": {...}} for a key with no reducer. What happens?"
        options:
          - "LangGraph raises an error: only one value per step is allowed"
          - "The last worker to finish wins, silently"
          - "The three dicts are merged automatically"
          - "Only the first worker's result is kept"
        answer: 0
        explanation: "With parallel writers the clash is an error (`InvalidUpdateError`). A reducer such as `merge` tells LangGraph how to combine the writes."

  - id: g4
    title: "Send: one node, many copies, and your first run"
    teach: |
      The fan-out is a **conditional edge** that returns a *list* of `Send` objects (lines 112 to 113):

      `[Send("check", {"opp": ..., "check": name}) for name in CHECKS]`

      Each `Send` says "run the node `check` with this payload". Three Sends mean the same node runs three
      times, once per payload, **in the same step**. `add_conditional_edges(START, fan_out, ["check"])`
      (line 125) wires it, and `add_edge("check", "aggregate")` (line 126) makes the aggregator wait until all
      three workers are done.

      The workers are `async def`, and `app.ainvoke` (line 136) runs them as concurrent tasks on one event loop.
      Nothing is a thread here: while one worker waits for the network or the model, the others run.

      Press **Run**. Three opportunities, three workers each: nine worker runs and three model calls.
    code: ["112-113", "122-128", "132-143"]
    do: "Press **Run**. In the Lanes panel, open OPP-1042: which bars overlap?"
    show: [run.calls, lanes.opportunities, lanes.workers, lanes.wall_s]
    notice: |
      All three bars start at about zero seconds. The two plain-code workers finish in a few hundredths of a
      second, and `notes` runs for a couple of seconds. They started together, so they overlap.
    check:
      - id: c1
        type: numeric
        prompt: "How many worker runs did the whole run make?"
        answer_from: lanes.workers
        explanation: "Nine: three workers for each of the three opportunities."

  - id: g5
    title: "The run as lanes: wall time against work done"
    teach: |
      Each opportunity's header in the Lanes panel shows two numbers.

      - **Wall** is the clock time from the fan-out to the verdict.
      - **Workers added up** is each bar's length added together: the time the same work would take if you ran
        the three workers one after another.

      In your run they are almost the same. That is the honest result from step 1: two of the three workers take
      about thirty milliseconds, so there is almost nothing to overlap with the model call. Parallel saved you a
      few hundredths of a second.

      So when does fan-out pay? When several workers are *each slow*. You will make one slow on purpose in the
      first experiment, and see **wall time follow the slowest bar**.
    do: "Open each opportunity in the Lanes panel. Compare **wall** with **workers added up**."
    show: [lanes.wall_s, lanes.work_s, run.calls, run.cost_usd]
    check:
      - id: c1
        type: mcq
        prompt: "Wall time is about 2.5 s and workers added up is about 2.6 s. What does that tell you?"
        options:
          - "One worker dominates, so running them in parallel saved almost nothing"
          - "The workers did not run in parallel"
          - "The aggregator is slow"
          - "The model call was cached"
        answer: 0
        explanation: "Parallel time is the slowest worker, sequential time is the sum. They are close when one worker is far slower than the rest."

  - id: g6
    title: "A time limit for each worker"
    teach: |
      A worker that never finishes is worse than one that fails, because the aggregator waits for it forever.
      So every worker gets its own clock. In `check_node` (line 99):

      `await asyncio.wait_for(CHECKS[name](job["opp"]), timeout=TIMEOUT_S)`

      If the limit passes, `wait_for` cancels that one check and raises `TimeoutError`. The `except` on line 100
      catches it **inside the worker**, so the worker returns a normal result and its siblings are untouched.

      That placement matters. A worker that **raises out of the node** makes LangGraph cancel the other workers
      and fail the whole step, so one bad check would throw away two good ones. Catching inside the worker
      turns a failure into **data**, the same move as lesson 13's `error` key.
    code: ["96-110"]
    do: "Read the worker, then go on."
    check:
      - id: c1
        type: mcq
        prompt: "One of three parallel workers raises an exception that nothing inside the worker catches. What happens to the step?"
        options:
          - "The other workers are cancelled and the step fails with that exception"
          - "The other two finish and the failed one is skipped"
          - "LangGraph retries the failed worker once"
          - "The aggregator runs with two results"
        answer: 0
        explanation: "An uncaught exception in a node fails the whole step. To keep the good results, catch errors inside the worker and return them as data."

  - id: g7
    title: "Failing honestly: unknown is not pass"
    teach: |
      When a worker times out or errors, what should its result be? `fail` would be a claim: *the rate check
      found a problem*. It did not, it found nothing. `pass` would be a worse claim. The honest answer is
      **`unknown`**: the check did not finish, so we do not know.

      Lines 100 to 101 record exactly that: `("unknown", "timed out after 20s")`. The aggregator's rule (line 26)
      then turns any `unknown` into `needs_review`: a person looks. It never turns a missing answer into an
      approval.

      The switch on line 21, `HONEST`, decides whether lines 104 to 105 downgrade that honesty. It is `True`
      now. In the third experiment you will turn it off and see what a quiet failure costs.

      There is a second place a result can go missing. If a worker never returns at all, `aggregate`
      (line 117) reads `results.get(name, {"outcome": "unknown"})`: an absent worker counts as `unknown`, not
      as a pass.
    code: [21, 26, "100-105", 117]
    do: "Read lines 96 to 119, then go on."
    check:
      - id: c1
        type: mcq
        prompt: "A worker timed out. Which outcome should it record?"
        options:
          - "`unknown`: the check did not finish"
          - "`pass`: nothing was wrong"
          - "`fail`: it did not answer"
          - "Nothing: leave it out of the results"
        answer: 0
        explanation: "`fail` claims a finding the check never made, `pass` claims safety it never confirmed, and leaving it out hides the gap. `unknown` states exactly what is true."

  - id: g8
    title: "Aggregation: the rule is data"
    teach: |
      `aggregate` (lines 116 to 119) runs once, after every worker has returned. It reads the three outcomes and
      applies the table in `RULE` (line 26): the first outcome in the list that **any** worker reported decides
      the verdict, and if none did, the answer is `approve`.

      Two things to see about that rule.

      - **It is a list, so it is ordered.** `fail` is first, so a `fail` beats an `unknown`: a deal with one
        failed check and one timeout is `reject`, not `needs_review`.
      - **It is data you can change**, not logic buried in the node. A stricter team puts `unknown` first. You
        edit one line, not a function.

      The workers also return in **no fixed order**, but the merged dict does not depend on that: each worker
      writes its own key, so the aggregator reads by name.
    code: [26, "116-119"]
    do: "Look at the verdict in the Lanes panel for OPP-1044, and the rate worker's detail."
    notice: |
      OPP-1044's `rate` worker failed with "no valid rate on 2026-11-09 for R-DSCI/IN": one of its effort rows
      has no rate on the start date. One `fail` is enough, so the verdict is `reject`, even though the other
      two workers passed.
    check:
      - id: c1
        type: mcq
        prompt: "Under RULE, a deal has one `fail`, one `unknown` and one `pass`. What is the verdict?"
        options:
          - "reject"
          - "needs_review"
          - "approve"
          - "It depends on which worker finished first"
        answer: 0
        explanation: "RULE is read in order and `fail` is first. The order the workers finished in never matters."

  - id: g9
    title: "Supervisor or swarm"
    teach: |
      This lesson used a **fan-out**: your code decides who works, all at once, and your code combines the
      results. There are two other shapes you will meet, and a way to choose between them. No code here, only
      the idea.

      **Supervisor.** One coordinator (often a model) decides which worker to call next, reads the result, and
      decides again. The workers do not talk to each other. The path is **chosen at run time**, but there is
      always one place that knows the whole plan.

      **Swarm.** There is no coordinator. Each agent can **hand off** to another agent when it decides the next
      step is not its job. Control passes along. There is no single place that holds the plan.

      Here is how they differ in what you can rely on.

      | | Fan-out (this lesson) | Supervisor | Swarm |
      |---|---|---|---|
      | Who decides the steps | your code, in advance | a coordinator, as it goes | each agent, at hand-off |
      | The path | fixed | varies per run | varies per run |
      | Where the plan lives | in the graph | in one coordinator | nowhere in particular |
      | Debugging | easy: same shape every run | medium: read the coordinator's choices | hard: follow the hand-offs |
      | Cost | known up front | grows with the coordinator's loop | grows with the hand-off chain |

      **Choose the least freedom that works.** Our three checks are independent and known in advance, so
      fan-out is right. If which check to run depends on the last result, you need a supervisor. A swarm earns
      its keep only when no one coordinator could know enough to route, which is rare. Every step towards
      more freedom costs you predictability, cost control and the ability to say *why* it did that.

      In LangGraph, a supervisor is a node with conditional edges that picks the next worker. A swarm is
      nodes that return `Command(goto=...)` to hand off. You have already used the first idea: lesson 12's
      router chose a path from a decision.
    do: "Read it, then go on."
    check:
      - id: c1
        type: mcq
        prompt: "You must run the same three independent checks on every deal, and you know them in advance. Which shape fits?"
        options:
          - "Fan-out: your code sends all three at once"
          - "Swarm: let the agents hand off"
          - "Supervisor: a model decides which check is next"
          - "Sequential: parallel is never safe"
        answer: 0
        explanation: "When the steps are known and independent, a coordinator or a hand-off chain only adds cost and unpredictability. Use the least freedom that works."

  - id: g10
    title: "Your run, as a bill"
    teach: |
      Make sure the settings are back to their defaults (`SLOW = None`, `TIMEOUT_S = 20`, `HONEST = True`) and
      Run once more, or reopen your earlier plain run.

      Nine worker runs made **three model calls**: one per opportunity, from `notes`. The six plain-code workers
      cost no tokens. Fan-out added no model calls. It never does: it changes *when* the calls happen, not how
      many there are.

      What you bought: a wall time set by the slowest worker, a result per worker you can inspect, and a
      timeout that cannot take the others down. What it cost: a reducer to write, and one rule you must
      choose, what a missing answer means.
    do: "Press **Run** with the defaults. Note the model calls and the cost."
    show: [run.calls, run.cost_usd, lanes.workers, lanes.unknown]
    check:
      - id: c1
        type: numeric
        prompt: "How many worker results were `unknown` in the default run?"
        answer_from: lanes.unknown
        explanation: "None: no worker timed out and no call failed. That changes in the experiments."

  - id: g11
    title: "Experiments, then the quiz"
    teach: |
      Three experiments, each changing one setting. First: slow one worker and watch wall time follow it.
      Second: give each worker a time limit shorter than the slow one. Third: turn off honest failure and see
      what a quiet timeout lets through. Then the quiz.
    quiz: true

experiments:
  - id: e1
    title: "Slow one worker"
    question: "If one of the three workers is slow, what does the whole job wait for, and what does the Lanes panel show?"
    predict:
      - id: p1
        type: numeric
        prompt: "With SLOW = \"account\" (it waits 8 seconds first), about how many seconds will OPP-1042's wall time be? (Before: about 3.)"
        answer_from: lanes.wall_s
        tol: 1.5
        unit: "seconds"
      - id: p2
        type: text
        prompt: "How long would the same three workers have taken one after another, and why is the gap smaller than you might hope?"
    change: |
      Set `SLOW = "account"` (line 18) and Run. Read the wall time in the Lanes panel for each opportunity. Then
      put it back to `None`.
    observe:
      - "The account bar is about eight seconds long, the other two are as before, and wall time is about eight seconds"
      - "Workers added up is about eleven seconds: the slow worker plus the model call"
      - "The verdicts do not change: slowing a worker changes when it answers, not what it answers"
    explain: |
      Measured (Opus 5.5, effort low, through the relay): with `account` held for 8 seconds, each opportunity took
      **about 8.0 seconds** of wall time. The same workers one after another would have been about **11 seconds**,
      the 8 plus the 3 of the model call. So parallel saved the three seconds of the model call, which ran
      inside the account worker's wait.

      That is the rule from the start: **wall time is the slowest worker**. A fan-out helps in proportion to how
      much *other* slow work hides behind the slowest one. Here the model call hid behind the held-up account
      check. Before the change, two thirty-millisecond workers hid behind the model call, which is why there was
      almost nothing to gain.

      The verdicts match the baseline: a delay is not a result, the check still answers the same question.

  - id: e2
    title: "A time limit shorter than the slow worker"
    question: "When the slow worker passes its own time limit, what does the run record, and do the others survive?"
    predict:
      - id: p1
        type: numeric
        prompt: "With SLOW = \"rate\", SLOW_S = 8 and TIMEOUT_S = 5, how many workers will time out across the three opportunities?"
        answer_from: lanes.timed_out
        tol: 0
        unit: "workers"
      - id: p2
        type: mcq
        prompt: "What will OPP-1044's verdict be? (Its rate check is really a `fail` when it runs.)"
        options:
          - "needs_review"
          - "reject"
          - "approve"
          - "The run crashes"
        answer: 0
    change: |
      Set `SLOW = "rate"` (line 18) and `TIMEOUT_S = 5` (line 20) and Run. Read each rate worker's detail and each
      verdict in the Lanes panel. Then put both back (`None`, `20`).
    observe:
      - "Each `rate` bar stops at five seconds, its detail reads `timed out after 5s`, and its outcome is `unknown`"
      - "The `account` and `notes` workers finish normally, and wall time is about five seconds per opportunity"
      - "OPP-1044 is `needs_review`, not `reject`: the check that would have failed it never ran"
    explain: |
      Measured (Opus 5.5, effort low): **three workers timed out**, one `rate` worker per opportunity, each at
      **5.0 seconds**. The other six workers finished normally, so the limit is per worker and a timeout
      costs only that worker's answer. The run made **three model calls**, as before. OPP-1042 and OPP-1044 were
      `needs_review`.

      Notice OPP-1044. With the rate check working, it is a `reject`. With the rate check timed out, the best the
      system can say is `needs_review`. That is the **price of honest failure**: you lose the finding, but you do
      not lose the truth that you have no finding. A person looks, which is the right fallback.

      The bounded wait is also what kept the run short: without it, the slow worker would be waited for
      indefinitely.

  - id: e3
    title: "Turn off honest failure"
    question: "If a timeout is quietly recorded as a pass, what does the aggregator conclude, and can anyone tell?"
    predict:
      - id: p1
        type: mcq
        prompt: "With the settings from experiment 2 and HONEST = False, what will OPP-1044's verdict be?"
        options:
          - "approve"
          - "needs_review"
          - "reject"
          - "The run crashes"
        answer: 0
      - id: p2
        type: numeric
        prompt: "How many of the three opportunities will be approved?"
        answer_from: lanes.approved
        tol: 1
        unit: "opportunities"
    change: |
      Keep `SLOW = "rate"` and `TIMEOUT_S = 5`, and set `HONEST = False` (line 21). Run. Read the `rate` details
      and the verdicts. Then put all three back (`None`, `20`, `True`).
    observe:
      - "Every `rate` detail still says `timed out after 5s`, but its outcome is now `pass`"
      - "OPP-1044 is `approve`, although its rate check would have failed it"
      - "Nothing crashed and nothing warned: the only trace is the detail text"
    explain: |
      Measured (Opus 5.5, effort low): all three `rate` workers timed out at **5.0 seconds**, and with `HONEST = False`
      each one recorded `pass`. OPP-1044, which fails the rate check when it runs, was **approved**, and so were the other two in
      this run. OPP-1043's note can make the `notes` worker say `high`, which would reject it: that result varies
      between runs.

      This is the dangerous one. The system is **fail-open**: when it cannot check, it lets the deal through.
      It looks fine because nothing errors. A fan-out has many workers, so many things can go quietly missing, and
      the aggregation rule is where each of them is either **counted** or **forgiven**.

      Decide it once, in the open, and write it as data: a missing or unfinished answer is `unknown`, and an
      `unknown` never counts as a pass.

quiz:
  - id: q1
    type: mcq
    prompt: "Three workers take 1 s, 4 s and 4 s and run in parallel. About how long does the aggregator wait before it runs?"
    options:
      - "4 seconds"
      - "9 seconds"
      - "1 second"
      - "3 seconds"
    answer: 0
    explanation: "The aggregator waits for every worker, so the wait is the slowest one's time, about 4 seconds. The sum, 9 seconds, is the work done."
  - id: q2
    type: mcq
    prompt: "A worker's call to a service times out. In a fan-out whose verdicts guard a real decision, what should the worker record?"
    options:
      - "`unknown`, and let the aggregation rule send it to review"
      - "`pass`, so one slow service cannot block the others"
      - "Nothing, and let the aggregator ignore the missing worker"
      - "`fail`, because an unanswered check is a failed check"
    answer: 0
    explanation: "`unknown` says exactly what is true. `pass` is fail-open and hides the gap, ignoring the worker does the same, and `fail` claims a finding that was never made."
  - id: q3
    type: mcq
    prompt: "Your steps are fixed and independent, and you know all of them in advance. Which shape do you pick?"
    options:
      - "A fan-out: your code sends them all at once and combines the results"
      - "A swarm: each agent hands off when it chooses"
      - "A supervisor: a model decides each step"
      - "A single model call that does everything"
    answer: 0
    explanation: "Choose the least freedom that works. Fixed, independent steps need no coordinator and no hand-offs, which only add cost and make the path harder to explain."

tutor_notes: >
  Built on measured runs (Opus 5.5, effort low, through the relay; langgraph 1.2.24). Task: review one Meridian opportunity with three checks run in parallel, over OPP-1042, OPP-1043,
  OPP-1044, one graph run per opportunity (asyncio.run, app.ainvoke). Workers: rate (plain code: GET /opportunities/<id>, then GET /rate-card?role&location&as_of per effort row; fails when a row has
  no valid rate on the start date; OPP-1044 fails on R-DSCI/IN for 2026-11-09), account (plain code: pages /accounts five at a time until the deal's account_id is found), notes (one model call,
  messages.parse into Risk {level none|low|high, reason}; high is a fail). Outcomes pass|fail|unknown; RULE = [("fail","reject"),("unknown","needs_review")], default approve. Graph:
  StateGraph(ReviewState) with results Annotated[dict, merge]; add_conditional_edges(START, fan_out, ["check"]) where fan_out returns a Send("check", {"opp","check"}) per check; add_edge("check","aggregate").
  Worker check_node(job) takes the Send payload, wraps CHECKS[name] in asyncio.wait_for(timeout=TIMEOUT_S), catches TimeoutError and httpx/validation errors into ("unknown", detail), and if HONEST is False
  records unknown as pass. Prints @@lane lines: kind lane {opp, check, start, end, outcome, detail} and kind verdict {opp, verdict, wall}. The Lanes panel draws bars on a shared axis and hides the lines
  from the Console. Baseline: wall 2.4 to 3.0 s per opportunity, workers added up about the same (the two plain workers take 20 to 40 ms, notes 2.4 to 3.3 s); 3 model calls; OPP-1042 approve, OPP-1044 reject,
  OPP-1043 approve or reject depending on whether notes calls its embedded "System:" line high risk. E1 SLOW="account" (8 s): wall 8.0 to 8.1 s per opportunity, work about 11 s. E2 SLOW="rate", TIMEOUT_S=5:
  three rate workers time out at 5.0 s, wall 5.0 s per opportunity, OPP-1042 and OPP-1044 needs_review, OPP-1043 reject or needs_review. E3 plus HONEST=False: rate recorded pass, wall 5.0 s, all three approved
  in the measured run (OPP-1044 approve although its rate check fails). Verified in the installed package: parallel Send workers writing a key without a reducer raise InvalidUpdateError ("Can receive only one
  value per step"); a worker that raises fails the whole superstep and cancels siblings; the merged dict order follows Send order, not completion order; recursion_limit counts supersteps, not workers.
  Facts: run.calls, run.cost_usd, lanes.opportunities, lanes.workers, lanes.wall_s, lanes.work_s, lanes.timed_out, lanes.unknown, lanes.failed_checks, lanes.approved, lanes.needs_review, lanes.rejected,
  lanes.first_verdict, lanes.last_verdict (parsed from the @@lane lines). Misconceptions: parallel makes it cheaper (no: same calls, same cost); parallel always saves a lot (no: only when workers are
  comparably slow); a timeout means fail (no: it means unknown); a missing result is harmless (no: the rule decides whether it passes); supervisor and swarm are the same (no: a supervisor keeps the plan
  in one place, a swarm hands off). Supervisor/swarm is taught only, with no code and no run.
