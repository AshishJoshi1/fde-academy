<!-- Flash cards: what building FDE Academy taught. Study one card at a time (flip, then "Knew it" or
     "Didn't know"), or read them all. A "Didn't know" is recorded like a quiz miss, so the card comes
     back in spaced review and in /today. Dynamic values are set with textContent; the only innerHTML
     is card markdown the server rendered with raw HTML disabled. -->
<section class="container page-head" style="padding-bottom:var(--sp-3)">
  <p class="eyebrow">Flash cards</p>
  <h1 id="deck-title">Flash cards</h1>
  <div class="prose lede" id="deck-summary"></div>
</section>

<section class="container stack-lg" style="padding-bottom:var(--sp-7)">
  <div class="row" style="flex-wrap:wrap;gap:var(--sp-3)">
    <div class="tabs-pill" role="tablist" aria-label="Mode" id="modes">
      <button class="tab" role="tab" type="button" aria-selected="true" data-mode="study">Study</button>
      <button class="tab" role="tab" type="button" aria-selected="false" data-mode="list">All cards</button>
    </div>
    <div class="tabs-pill" role="tablist" aria-label="Tag" id="tags"></div>
    <span class="spacer"></span>
    <span class="small secondary num" id="tally"></span>
  </div>
  <div id="study" role="tabpanel"><p class="small muted">Loading the cards…</p></div>
  <div class="stack" id="list" role="tabpanel" hidden></div>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var deck = null, mode = "study", tag = "all", queue = [], at = 0, flipped = false, session = {knew: 0, didnt: 0};

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function html(cls, markup) {   // card markdown, rendered by the server with raw HTML disabled
    var d = el("div", cls);
    d.innerHTML = markup;
    return d;
  }
  function button(cls, text, onClick) {
    var b = el("button", cls, text);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }
  function lastPill(card) {
    if (!card.last) return el("span", "pill pill-plain", "New");
    return card.last.correct ? el("span", "pill pill-good", "Knew it last time")
                             : el("span", "pill pill-critical", "Didn't know last time");
  }
  function shown() { return deck.cards.filter(function (c) { return tag === "all" || c.tag === tag; }); }

  // Study order: cards you didn't know first, then new ones, then the ones you knew. Fixed until
  // you change the tag or start a new round, so grading a card doesn't reshuffle the rest.
  function buildQueue(first) {
    var rank = function (c) { return !c.last ? 1 : c.last.correct ? 2 : 0; };
    queue = shown().slice().sort(function (a, b) { return rank(a) - rank(b); });
    if (first) {
      var i = queue.findIndex(function (c) { return c.id === first; });
      if (i > 0) queue.unshift(queue.splice(i, 1)[0]);
    }
    at = 0; flipped = false; session = {knew: 0, didnt: 0};
  }

  function renderTags() {
    var box = $("tags");
    box.textContent = "";
    var all = [["all", "All"]].concat(Object.keys(deck.tags).map(function (k) { return [k, deck.tags[k]]; }));
    all.forEach(function (t) {
      var n = t[0] === "all" ? deck.cards.length : deck.cards.filter(function (c) { return c.tag === t[0]; }).length;
      var b = button("tab", t[1] + " ", function () { tag = t[0]; buildQueue(); render(); });
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(t[0] === tag));
      b.dataset.tag = t[0];
      b.append(el("span", "count", String(n)));
      box.append(b);
    });
  }

  function renderTally() {
    var cards = shown(), known = cards.filter(function (c) { return c.last && c.last.correct; }).length;
    var missed = cards.filter(function (c) { return c.last && !c.last.correct; }).length;
    $("tally").textContent = known + " known · " + missed + " to review · " + (cards.length - known - missed) + " new";
  }

  function review(card, knew) {
    return fetch("/api/cards/" + encodeURIComponent(deck.id) + "/" + encodeURIComponent(card.id) + "/review", {
      method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({knew: knew})
    }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status)); return j; });
    }).then(function (j) {
      card.last = j.last;
      session[knew ? "knew" : "didnt"] += 1;
      at += 1; flipped = false;
      render();
    });
  }

  function renderStudy() {
    var box = $("study");
    box.textContent = "";
    if (!queue.length) { box.append(el("p", "small muted", "No cards with this tag.")); return; }
    if (at >= queue.length) {
      var end = el("article", "card card-pad quiz-card stack");
      end.append(el("h2", null, "Round done"),
                 el("p", "secondary", "You knew " + session.knew + " and didn't know " + session.didnt + ". " +
                    "The ones you didn't know come back in spaced review on the home page and in /today."),
                 button("btn btn-primary", "Start another round", function () { buildQueue(); render(); }));
      end.querySelector("h2").style.margin = "0";
      box.append(end);
      return;
    }
    var card = queue[at], art = el("article", "card card-pad quiz-card stack fc-card");
    art.id = "fc-" + card.id;
    var meta = el("div", "quiz-meta");
    meta.append(el("span", "pill pill-plain", deck.tags[card.tag]), lastPill(card), el("span", "spacer"),
                el("span", "num", "Card " + (at + 1) + " of " + queue.length));
    art.append(meta, html("quiz-q fc-front", card.front_html));
    if (!flipped) {
      art.append(el("div", "row"));
      art.lastChild.append(button("btn btn-primary", "Show the answer", function () { flipped = true; render(); }),
                           el("span", "spacer"),
                           button("btn btn-ghost", "Skip", function () { at += 1; render(); }));
    } else {
      var back = html("quiz-feedback prose fc-back", card.back_html);
      art.append(back, el("p", "small muted", "Source: " + card.source));
      art.lastChild.style.margin = "0";
      var row = el("div", "row"), msg = el("span", "small muted");
      var grade = function (knew) {
        return function () {
          row.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
          review(card, knew).catch(function (e) {
            msg.textContent = "Could not save: " + e.message;
            row.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
          });
        };
      };
      row.append(el("span", "small secondary", "Did you know it?"),
                 button("btn", "Didn't know", grade(false)), button("btn btn-primary", "Knew it", grade(true)), msg);
      art.append(row);
    }
    box.append(art);
  }

  function renderList() {
    var box = $("list");
    box.textContent = "";
    shown().forEach(function (card) {
      var d = el("details", "card card-pad fc-item");
      d.id = card.id;
      if (location.hash.slice(1) === card.id) d.open = true;
      var sum = el("summary", "row");
      sum.style.cursor = "pointer";
      sum.append(el("span", "pill pill-plain", deck.tags[card.tag]), html("fc-front", card.front_html),
                 el("span", "spacer"), lastPill(card));
      var body = el("div", "stack");
      body.style.marginTop = "var(--sp-3)";
      body.append(html("quiz-feedback prose", card.back_html), el("p", "small muted", "Source: " + card.source));
      body.lastChild.style.margin = "0";
      d.append(sum, body);
      box.append(d);
    });
  }

  function render() {
    renderTags();
    renderTally();
    document.querySelectorAll("#modes .tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.mode === mode)); });
    $("study").hidden = mode !== "study";
    $("list").hidden = mode !== "list";
    if (mode === "study") renderStudy(); else renderList();
  }

  document.querySelectorAll("#modes .tab").forEach(function (b) {
    b.addEventListener("click", function () { mode = b.dataset.mode; if (mode === "study") buildQueue(); render(); });
  });

  fetch("/api/cards").then(function (r) { return r.json(); }).then(function (j) {
    if (!j.decks.length) { $("study").textContent = "No flash cards yet: add a deck under content/cards/."; return; }
    deck = j.decks[0];
    $("deck-title").textContent = deck.title;
    $("deck-summary").innerHTML = deck.summary_html;
    buildQueue(location.hash.slice(1));   // #<card id>, from the home page's spaced review, opens that card first
    render();
  }).catch(function (e) { $("study").textContent = "Could not load the cards: " + e.message; });
})();
</script>
