[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-academy"
version = "0.1.0"
description = "Interactive, Claude-guided course on building GenAI systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=2.6,<3",      # 2.x sends anthropic-version 2026-10-21 and Bearer auth
    "httpx>=0.27",            # relay upstream client + FastAPI TestClient
    "pydantic>=2.9",
    "pyyaml>=6",
    "markdown-it-py>=3",      # lesson text (step.md) on the lab page; raw HTML disabled
    "truststore>=0.9",        # corporate TLS interception (Windows cert store)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
graph = ["langgraph>=1.0"]
rag = ["qdrant-client>=1.12"]
data = ["numpy>=2.1", "pandas>=2.2"]
obs = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]

[project.scripts]
academy = "academy_server.__main__:main"
labctl = "academy_server.labctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academy_server = ["pages/*.html", "fixtures/meridian/seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
